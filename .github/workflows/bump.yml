name: Bump formulae

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

concurrency:
  group: bump-formulae
  cancel-in-progress: false

jobs:
  systemless:
    runs-on: macos-26
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@18fcb8e3e06b4247c676c506750dc95ea7226479 # 2026.07.13.1

      - name: Check for a new systemless release
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest="$(
            brew livecheck \
              --formula \
              --json \
              --newer-only \
              benletchford/tap/systemless \
              | jq -r '.[0].version.latest // empty'
          )"

          if [[ -z "$latest" ]]
          then
            echo "The systemless formula is already current."
            exit 0
          fi

          brew bump-formula-pr \
            --no-browse \
            --no-fork \
            --online \
            --strict \
            --version="$latest" \
            benletchford/tap/systemless
