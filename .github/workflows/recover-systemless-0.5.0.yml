name: Recover systemless 0.5.0 bottles

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/recover-systemless-0.5.0.yml

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Pull bottles
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GITHUB_SHA="aa8e8c6e0fed38b944df8f48e46ce744b130fbd3" brew pr-pull \
            --no-cherry-pick \
            --clean \
            --debug \
            --tap="$GITHUB_REPOSITORY" \
            --head-sha="b033ccd0f3cbe4e5082c716241839c7865199a9a" \
            6

      - name: Push commits
        uses: Homebrew/actions/git-try-push@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          branch: main
