name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  FORMULA: benletchford/tap/systemless

jobs:
  # Guards the invariant the release pipeline is built around: whatever bottles
  # the formula advertises have to be downloadable for the version it pins. A
  # formula with no bottle block is fine, because it builds from source, but a
  # block left behind by a half-finished release is not, and that is exactly
  # how 0.7.0 reached main.
  consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the formula against its bottles
        run: |
          set -euo pipefail

          info="$(brew info --json=v2 --formula "$FORMULA")"
          version="$(jq -r '.formulae[0].versions.stable' <<<"$info")"
          bottles="$(
            jq -r '.formulae[0].bottle.stable.files // {} | to_entries[] | "\(.key) \(.value.url)"' \
              <<<"$info"
          )"

          if [[ -z "$bottles" ]]
          then
            echo "systemless $version ships no bottles and builds from source."
            exit 0
          fi

          failed=false

          while read -r tag url
          do
            [[ -z "$tag" ]] && continue

            if [[ "$url" != *"-$version."* ]]
            then
              echo "The $tag bottle URL does not match formula version $version: $url" >&2
              failed=true
              continue
            fi

            status="$(curl -sIL -o /dev/null -w '%{http_code}' "$url")"
            if [[ "$status" != "200" ]]
            then
              echo "The $tag bottle is not downloadable (HTTP $status): $url" >&2
              failed=true
              continue
            fi

            echo "The $tag bottle for $version is downloadable."
          done <<<"$bottles"

          if [[ "$failed" == "true" ]]
          then
            echo "The formula advertises bottles that users cannot install." >&2
            exit 1
          fi

  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # Release bottles are built and published by release.yml. This only
      # checks that a formula changed by hand still builds and tests.
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
