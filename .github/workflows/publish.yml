name: brew pr-pull

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number
        required: true
      head_sha:
        description: Expected pull request head commit SHA (optional)

jobs:
  pr-pull:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      issues: read
      pull-requests: write
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up git
        uses: Homebrew/actions/git-user-config@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Pull bottles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PULL_REQUEST: ${{ inputs.pull_request }}
        run: |
          pr_pull_args=(
            --debug
            --tap="$GITHUB_REPOSITORY"
          )

          if [[ -n "$HEAD_SHA" ]]
          then
            pr_pull_args+=(--head-sha="$HEAD_SHA")
          fi

          pr_state="$(
            gh pr view "$PULL_REQUEST" \
              --repo "$GITHUB_REPOSITORY" \
              --json state \
              --jq '.state'
          )"

          if [[ "$pr_state" == "MERGED" ]]
          then
            base_sha="$(
              gh pr view "$PULL_REQUEST" \
                --repo "$GITHUB_REPOSITORY" \
                --json baseRefOid \
                --jq '.baseRefOid'
            )"
            GITHUB_SHA="$base_sha" brew pr-pull \
              --no-cherry-pick \
              --clean \
              "${pr_pull_args[@]}" \
              "$PULL_REQUEST"
          else
            brew pr-pull "${pr_pull_args[@]}" "$PULL_REQUEST"
          fi

      - name: Push commits
        uses: Homebrew/actions/git-try-push@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          branch: main
